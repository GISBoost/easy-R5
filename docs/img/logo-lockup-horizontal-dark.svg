<?xml version="1.0" encoding="UTF-8"?>
<!-- Dark-theme horizontal lockup. Identical to logo-lockup-horizontal.svg except
     the wordmark, which is light: the navy #1B3A5C of the light version is
     invisible on GitHub's dark canvas (#0d1117). The mark itself is unchanged —
     a filled hexagon with light strokes reads on both themes. Keep the two files
     in sync; README picks one with <picture media="(prefers-color-scheme: dark)">. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64">
  <g transform="translate(0,0)">
    <polygon points="32,4 7.76,18 7.76,46 32,60 56.24,46 56.24,18"
             fill="#1B3A5C" stroke="#A9B8C7" stroke-width="1.8"/>
    <g stroke-linecap="round" fill="none" stroke-width="2.3">
      <path d="M32,32 L28.4,22.2" stroke="#B8860B"/>
      <path d="M28.4,22.2 L30.6,13.8" stroke="#F5D98B"/>
      <path d="M32,32 L40.8,26.4" stroke="#B8860B"/>
      <path d="M40.8,26.4 L42.0,17.8" stroke="#F5D98B"/>
      <path d="M32,32 L34.6,42.0" stroke="#B8860B"/>
      <path d="M34.6,42.0 L33.8,50.6" stroke="#F5D98B"/>
      <path d="M32,32 L22.2,35.2" stroke="#B8860B"/>
      <path d="M22.2,35.2 L17.6,42.6" stroke="#F5D98B"/>
    </g>
    <g stroke-linecap="round" fill="none" stroke-width="1.4" stroke="#B8860B">
      <path d="M40.8,26.4 L46.4,28.4"/>
      <path d="M22.2,35.2 L16.8,32.6"/>
    </g>
    <g fill="#F4F6F8">
      <circle cx="32" cy="32" r="4.6"/>
      <circle cx="28.4" cy="22.2" r="2.4"/>
      <circle cx="30.6" cy="13.8" r="2.4"/>
      <circle cx="40.8" cy="26.4" r="2.4"/>
      <circle cx="42.0" cy="17.8" r="2.4"/>
      <circle cx="34.6" cy="42.0" r="2.4"/>
      <circle cx="33.8" cy="50.6" r="2.4"/>
      <circle cx="22.2" cy="35.2" r="2.4"/>
      <circle cx="17.6" cy="42.6" r="2.4"/>
      <circle cx="46.4" cy="28.4" r="1.6"/>
      <circle cx="16.8" cy="32.6" r="1.6"/>
    </g>
  </g>
  <text x="80" y="41" font-family="Inter, 'Source Sans 3', 'IBM Plex Sans', Manrope, sans-serif"
        font-size="28" font-weight="600" fill="#E6EDF3">Easy-R5</text>
</svg>
