name: apartment-finder — OD matrices (M5)

# On-demand, NOT a recurring pipeline: workflow_dispatch only. Moves the long R5 computation of
# tools/apartment_finder (5 days x 4 times of day x 12 transit scenarios, ~2.2 min each locally) off the
# local machine: one job per (day, window), all in parallel, so the wall time is one job (~1.5-2 h) instead of ~10 h.
#
# No QGIS on the runner: scripts/ci_matrices.py drives R5 through easy_r5/core (same pattern as
# tram-failure-lodz.yml). Walk, bike and car matrices are cheap and depend on neither the day nor GTFS; they are
# computed locally. Download the results with `gh run download <id>` into tools/apartment_finder/data/matrices/,
# then run scripts/aggregate.py and scripts/export_web.py locally.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Comma-separated days (blank = config/days.yaml)'
        required: false
        default: ''
      windows:
        description: 'Comma-separated windows (blank = morning,midday,afternoon,allday)'
        required: false
        default: ''
      osm_release:
        description: 'Optional easy-R5 release tag holding a pre-clipped lodz.osm.pbf. Blank = clip from Geofabrik (current OSM)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        shell: bash
        run: |
          set -euo pipefail
          pip install pyyaml
          python - <<'PY'
          import json, os, yaml
          days = [d for d in os.environ.get("DAYS", "").replace(" ", "").split(",") if d] or \
                 yaml.safe_load(open("tools/apartment_finder/config/days.yaml", encoding="utf-8"))["days"]
          wins = [w for w in os.environ.get("WINDOWS", "").replace(" ", "").split(",") if w] or \
                 ["morning", "midday", "afternoon", "allday"]
          m = {"include": [{"day": d, "window": w} for d in days for w in wins]}
          open(os.environ["GITHUB_OUTPUT"], "a").write("matrix=" + json.dumps(m) + "\n")
          print(m)
          PY
        env:
          DAYS: ${{ github.event.inputs.days }}
          WINDOWS: ${{ github.event.inputs.windows }}

  compute:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Locally 12 scenarios x ~2.2 min + 6 network builds; a 4-core runner is ~3x slower. 330 min stays under
    # GitHub's 360 min job cap.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: tools/apartment_finder
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      OSM_RELEASE: ${{ github.event.inputs.osm_release }}
      HEAP_GB: '11'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'      # ADR-0002

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install numpy pandas pyyaml

      - name: Cache the pinned R5 jar
        uses: actions/cache@v4
        with:
          path: tools/apartment_finder/_ci_work/r5-v7.6-all.jar
          key: r5-jar-v7.6

      - name: Install osmosis
        if: env.OSM_RELEASE == ''
        run: sudo apt-get update -y && sudo apt-get install -y osmosis

      - name: Get the OSM extract
        run: |
          set -euo pipefail
          if [ -n "$OSM_RELEASE" ]; then
            gh release download "$OSM_RELEASE" --repo GISBoost/easy-R5 --pattern "lodz.osm.pbf" --output lodz.osm.pbf --clobber
          else
            # City bbox + ~5 km margin; completeWays=yes is required (dangling node refs crash R5's builder).
            curl -fL -o region.osm.pbf https://download.geofabrik.de/europe/poland/lodzkie-latest.osm.pbf
            osmosis --read-pbf file=region.osm.pbf \
              --bounding-box left=19.1672 bottom=51.6035 right=19.7404 top=51.9155 completeWays=yes \
              --write-pbf file=lodz.osm.pbf
            rm -f region.osm.pbf
          fi
          ls -la lodz.osm.pbf

      - name: Run the scenarios of this day and window
        run: |
          set -euo pipefail
          python scripts/ci_matrices.py --day "${{ matrix.day }}" --window "${{ matrix.window }}" \
            --osm lodz.osm.pbf --heap-gb "$HEAP_GB"

      - uses: actions/upload-artifact@v4
        with:
          name: apt-matrices-${{ matrix.day }}-${{ matrix.window }}
          path: |
            tools/apartment_finder/data/matrices/${{ matrix.day }}/*.npz
            tools/apartment_finder/data/matrices/${{ matrix.day }}/*.json
          retention-days: 14
