name: lodz-timetable-change — R5 hex 250 m to nearest POIs (realized P50, Mondays)

# On-demand (workflow_dispatch only). tools/lodz_timetable_change/poi_tt.py on the realized P50 GTFS of each Monday
# (config.yaml -> cases): R5 p50 travel times from every 250 m hex to the frozen nearest pharmacies / schools / clinics
# / supermarkets, per departure band. One job per Monday plus one walk-only job; they run in parallel.
#
# One `prepare` job clips the OSM extract ONCE and every job downloads that same artifact, so all Mondays are routed on
# the same OSM snapshot. No QGIS on the runner (R5 is driven through easy_r5/core, as in tram-failure-lodz.yml).
# Download with `gh run download <id>` into <data_dir>/poi_tt/ (npz per case/band + walk.npz), then run poi_delta.py.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Comma-separated cases from config.yaml (ctrl = 21 Sep, before = 28 Sep, after = 5 Oct)'
        required: false
        default: 'ctrl,before'
      bands:
        description: 'Comma-separated bands (blank = all: am_peak,midday,pm_peak,evening)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        shell: bash
        run: |
          set -euo pipefail
          pip install pyyaml
          python - <<'PY'
          import json, os, yaml
          cfg = yaml.safe_load(open("tools/lodz_timetable_change/config.yaml", encoding="utf-8"))
          want = [c for c in os.environ["CASES"].replace(" ", "").split(",") if c]
          inc = [{"kind": "tt", "case": c, "day": cfg["cases"][c]["date"]} for c in want]
          inc.append({"kind": "walk", "case": want[0], "day": cfg["cases"][want[0]]["date"]})
          open(os.environ["GITHUB_OUTPUT"], "a").write("matrix=" + json.dumps({"include": inc}) + "\n")
          print(inc)
          PY
        env:
          CASES: ${{ github.event.inputs.cases || 'ctrl,before' }}

  prepare:
    runs-on: ubuntu-latest
    steps:
      # osmosis' jars are class-file version 65 (Java 21); the runner's default Java 17 fails with UnsupportedClassVersionError.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install osmosis
        run: sudo apt-get update -y && sudo apt-get install -y osmosis

      - name: Clip the Lodz OSM extract once
        run: |
          set -euo pipefail
          curl -fL -o region.osm.pbf https://download.geofabrik.de/europe/poland/lodzkie-latest.osm.pbf
          # City bbox + ~5 km margin; completeWays=yes is required (dangling node refs crash R5's builder).
          osmosis --read-pbf file=region.osm.pbf \
            --bounding-box left=19.1672 bottom=51.6035 right=19.7404 top=51.9155 completeWays=yes \
            --write-pbf file=lodz.osm.pbf
          sha256sum lodz.osm.pbf | tee lodz.osm.pbf.sha256
          ls -la lodz.osm.pbf

      - uses: actions/upload-artifact@v4
        with:
          name: lodz-osm
          path: |
            lodz.osm.pbf
            lodz.osm.pbf.sha256
          retention-days: 14

  compute:
    needs: [plan, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # 5665 origins x 928 POIs x 4 bands: ~5 min per band locally on 12 threads, a 4-core runner is ~3x slower.
    timeout-minutes: 240
    defaults:
      run:
        working-directory: tools/lodz_timetable_change
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      HEAP_GB: '11'      # 16 GB runner, as in tram-failure-lodz.yml
      BANDS: ${{ github.event.inputs.bands }}
      S3_DATA_DIR: ${{ github.workspace }}/_s3data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'      # ADR-0002

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyyaml numpy

      - name: Cache the pinned R5 jar
        uses: actions/cache@v4
        with:
          path: tools/lodz_timetable_change/_ci_work/r5-v7.6-all.jar
          key: r5-jar-v7.6

      - uses: actions/download-artifact@v4
        with:
          name: lodz-osm
          path: tools/lodz_timetable_change

      - name: Get the realized P50 GTFS of this Monday
        run: |
          set -euo pipefail
          D="${{ matrix.day }}"
          mkdir -p gtfs
          gh release download "lodz-realized-${D}-phone" --repo GISBoost/easy-GTFS-RT \
            --pattern "lodz_realized_${D}_p50.zip" --dir gtfs --clobber
          ls -la gtfs

      - name: Run R5
        run: |
          set -euo pipefail
          case "${{ matrix.kind }}" in
            tt)   python poi_tt.py --osm lodz.osm.pbf --gtfs-dir gtfs --skip-walk \
                    --cases "${{ matrix.case }}" --bands "$BANDS" --heap-gb "$HEAP_GB" ;;
            walk) python poi_tt.py --osm lodz.osm.pbf --gtfs-dir gtfs --walk-only \
                    --cases "${{ matrix.case }}" --heap-gb "$HEAP_GB" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: poi-tt-${{ matrix.kind }}-${{ matrix.case }}
          path: |
            ${{ github.workspace }}/_s3data/poi_tt/${{ matrix.case }}/
            ${{ github.workspace }}/_s3data/poi_tt/walk.npz
          retention-days: 30
