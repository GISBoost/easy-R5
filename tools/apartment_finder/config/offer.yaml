# Offer layer (developers' asking prices, deweloperuch.pl via the deweloperuch-mcp CLI). Bump offer_version when anything here changes.
offer_version: "offer-v1"
source:
  cli: [uvx, --from, deweloperuch-mcp==0.1.3, deweloperuch]   # override with offer_fetch.py --cli PATH (e.g. a venv's deweloperuch.exe)
  city_slug: lodz
  limit: 500           # one request returns every investment of the city with active offers (119 on 2026-10-26)
filter:
  avg_area_m2: [25, 120]   # the service does not type investments; the RCN flat range drops the house developments
  price_m2: [2500, 40000]
hex:                   # adaptive reach as in price.yaml, counted in investments (far fewer than deeds, hence the wider circle)
  min_n: 3             # investments needed for a value (below at max radius: no value, never 0)
  min_developers: 2    # ... from at least this many developers (one developer cannot set the value)
  start_radius_m: 500
  max_radius_m: 2000   # 2026-10-26 probe: 89 % of the hexes with an RCN price covered at 2000 m, 65 % at 1500 m
  radius_step_m: 100
  weight_edge: 0.25    # distance weight falls linearly from 1 at the centre to this value at the radius used
