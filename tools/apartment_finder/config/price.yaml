# Price layer (RCN transactions): cleaning rules. Bump price_version when anything here changes.
price_version: "price-v1"
window:
  from: "2025-07-01"   # the register has (almost) no Lodz deeds 2019-2024; this is the first usable stretch (docs/notes/apartment-finder-price-m0.md)
teryt: "1061"          # Lodz city county
function: mieszkalna
area_m2: [25, 120]
price_m2: [2500, 25000]
transaction_types: [wolnyRynek]   # drops discounted, tender, non-tender and enforcement sales
share: "1/1"           # NIER_UDZIAL; fractional shares of a flat are not whole-flat prices
hex:                   # adaptive reach: smallest radius around the hex centre with enough deeds
  min_n: 10            # deeds needed for a value (below at max radius: no value, never 0)
  min_points: 5        # ... and at least this many distinct locations (one development cannot dominate); costs 0.4 pp coverage
  start_radius_m: 250
  max_radius_m: 1000
  radius_step_m: 50
  weight_edge: 0.25    # distance weight falls linearly from 1 at the centre to this value at the radius used
inhabited:             # hex counts as residential with at least this much BDOT10k residential building footprint
  min_footprint_m2: 1000
  bdot_dir: "data/canopy/bdot"
