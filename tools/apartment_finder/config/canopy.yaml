# Tree-canopy cover per hex (canopy module, docs/notes/apartment-finder-canopy-m0.md). Method: nDSM = NMPT - NMT (GUGiK 2021, 0.5 m)
# minus buildings and other structures (BDOT10k), morphological clean-up, aggregated to hexes. Bump canopy_version on any change.
canopy_version: "canopy-v2"
source:
  scan_date: "2021-04"           # month of the flight (shown on the site as "state from ...")
  year: 2021                     # airborne laser scanning, April 2021 (leaf-off), 25 pts/m2, PL-2000 zone 6 (EPSG:2177), EVRF2007
  nmpt_wfs: "https://mapy.geoportal.gov.pl/wss/service/PZGIK/NumerycznyModelPokryciaTerenuEVRF2007/WFS/Skorowidze"
  nmpt_layer: "gugik:SkorowidzNMPT2021"
  nmt_wfs: "https://mapy.geoportal.gov.pl/wss/service/PZGIK/NumerycznyModelTerenuEVRF2007/WFS/Skorowidze"
  nmt_layer: "gugik:SkorowidzNMT2021"
  lidar_index_gml: "idx2021.gml"  # LAZ index (skorowidz) used only to list the tiles covering the city + buffer
  bdot10k_url: "https://opendata.geoportal.gov.pl/bdot10k/schemat2021/GPKG/10/1061_GPKG.zip"
mask_dir: final_v2                # directory under data/canopy/ holding the canopy mask used by canopy_hex.py and canopy_overlay.py
tiles_buffer_m: 400              # tiles within this distance of the city count (edge hexes + neighbourhood buffers)
height_m: 3.0                    # canopy = nDSM >= this (2.0 includes more shrubs; stored codes allow re-thresholding)
height_codes_m: [2.0, 3.0, 5.0]  # thresholds stored per pixel (code = number of thresholds reached)
max_height_m: 50.0               # taller nDSM (cranes, masts) is not a tree
exclude:                         # BDOT10k layers whose footprint is NOT canopy; buffer in metres (points/lines need one)
  polygons: {BUBD_A: 1.0, BUZT_A: 1.0, BUIT_A: 1.0, BUWT_A: 1.0, BUSP_A: 1.0}   # buildings, tanks, technical, towers, sport structures
  lines:    {BUIN_L: 3.0}                                                         # bridges, viaducts
  points:   {BUWT_P: 3.0, BUIT_P: 2.0, BUZT_P: 3.0}                               # masts, technical devices, tanks
open_radius_m: 1.0               # removes objects thinner than ~2 m (poles, lamp arms, wires, fences)
smooth:                          # flat tall surfaces (viaduct decks, flat roofs missing from BDOT10k) are not canopy: crowns are rough
  window_px: 5                   # local standard deviation of NMPT in a 5 x 5 px (2.5 x 2.5 m) window, stored per pixel in cm (band 2)
  max_std_m: 0.12                # <= this = smooth
  min_area_m2: 30.0              # a smooth tall patch at least this big is a structure
  dilate_m: 2.5                  # structure edges (parapets, eaves) are steep and rough: grow the structure by this much
min_patch_m2: 10.0               # removes patches smaller than this
overlay_res_m: 8.0                # preview image resolution (web mercator metres per pixel), see canopy_overlay.py
overlay_quality: 60
