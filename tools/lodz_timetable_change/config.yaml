# The only place for numbers and paths (no magic numbers in the scripts).
# Data lives outside git and outside C: (see repo CLAUDE.md "Dane").
data_dir: "G:/easy_data/lodz_timetable_change"

source:
  repo: "GISBoost/easy-GTFS-RT"      # public release assets
  city: lodz
  tag: "{city}-realized-{date}-phone"
  assets:
    tidy: "{city}_tidy_{date}.csv.gz"
    static: "{city}_static_gtfs_{date}.zip"
    realized: "{city}_realized_{date}_p50.zip"   # the "model" of a day: static timetable with GTFS-RT-measured P50 times

fetch:
  from: "2026-09-01"
  tidy_weekdays_from: "2026-09-07"
  to: null
  retries: 3
  timeout_s: 120

# Origins: hex 250 m centroids (frozen from tools/tram_failure_lodz/inputs, census polygons are not public).
# Destinations: service points / POIs only (no hex-to-hex pairs). The k nearest points of each category are picked
# ONCE by straight-line distance and frozen in inputs/nearest.csv, so both models route to exactly the same points
# ("nearest" is geometric, not "fastest").
poi:
  origins: inputs/hex250_origins.csv
  pop: inputs/hex250_pop.csv           # population per hex (weights, 670 270 people)
  source_gpkg: "../lodzkie_na_mapach_2026/lodzkie_base.gpkg"   # layer poi_targets_lodz (OSM, 4161 points, 21 categories)
  source_layer: poi_targets_lodz
  categories:                          # name -> one-hot field in poi_targets_lodz
    pharmacy: srv_apteka
    school: srv_szkola
    clinic: srv_przychodnia
    supermarket: srv_supermarket
  k_nearest: 3
  pois: inputs/poi_dest.csv
  nearest: inputs/nearest.csv

# case -> Monday and the model: realized P50 GTFS published on that day (release lodz-realized-<date>-phone).
# `ctrl` = the Monday before `before`; ctrl vs before are both pre-change, so that pair measures noise (placebo).
cases:
  ctrl:   {date: "2026-09-21"}
  before: {date: "2026-09-28"}
  after:  {date: "2026-10-05"}         # first Monday of the new routes; release appears the evening of the day itself

# Departure windows, aligned with transit-index config/metrics.yaml (am 7-8, midday 9-13, pm 14-17, evening 18-21).
bands:
  am_peak: {departure: "07:00", window_min: 120}
  midday:  {departure: "09:00", window_min: 300}
  pm_peak: {departure: "14:00", window_min: 240}
  evening: {departure: "18:00", window_min: 240}

r5:
  percentiles: [50]
  max_trip_duration_min: 120
  max_walk_time_min: 30              # transit run
  walk_only_max_walk_min: 120        # walk-only run: wide cap so "walking is faster" is judged correctly
  walk_speed_kmh: 3.6
  max_rides: 3
  monte_carlo_draws: 5

# delta = later - earlier, in minutes; negative = the later Monday is faster.
pairs:
  main:    {later: after,  earlier: before}   # 5 Oct vs 28 Sep
  placebo: {later: before, earlier: ctrl}     # 28 Sep vs 21 Sep, both before the change

# A hex-POI pair is "transit" on a day when R5 reaches it and the time beats walking (or walking is impossible);
# pairs are compared only if they are transit on BOTH days (no walk-only trips, as requested). R5 times are whole minutes.
