<?xml version="1.0" encoding="UTF-8"?>
<!-- Easy-R5 mark. Point-up hexagon (network-on-a-grid family, per
     docs/notes/logo-brief.md concept B), schematic routes radiating from a
     hub: same "network diagram, not a vehicle" idea r5r/r5py use, but our
     own composition: routes are two-tone to read as "slower near the stop,
     faster running between stops" (the accessibility idea, not r5r's plain
     white spokes), one accent hue (goldenrod) instead of r5r/r5py's teal,
     no italic, no gradient blend (two flat steps only). Navy is not r5r's
     #1B87A8. See docs/notes/logo-brief.md sec 1/3/4/8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <polygon points="16,2 3.88,9 3.88,23 16,30 28.12,23 28.12,9"
           fill="#1B3A5C" stroke="#A9B8C7" stroke-width="1.2"/>
  <!-- 4 routes at irregular, non-opposite angles, not a symmetric cross/X:
       an earlier version used two straight diagonals through the hub and
       read as a close/asterisk glyph at 24px, confirmed by screenshot. Each
       route also bends at its first node (a route "turning" past a stop,
       not running straight through); bend angle and direction differ per
       arm, not one rotation repeated 4x, specifically to avoid a pinwheel
       / swastika read from 4-fold rotational symmetry. -->
  <g stroke-linecap="round" fill="none" stroke-width="1.2">
    <path d="M16,16 L14.2,11.1" stroke="#B8860B"/>
    <path d="M14.2,11.1 L15.3,6.9" stroke="#F5D98B"/>
    <path d="M16,16 L20.4,13.2" stroke="#B8860B"/>
    <path d="M20.4,13.2 L21.0,8.9" stroke="#F5D98B"/>
    <path d="M16,16 L17.3,21.0" stroke="#B8860B"/>
    <path d="M17.3,21.0 L16.9,25.3" stroke="#F5D98B"/>
    <path d="M16,16 L11.1,17.6" stroke="#B8860B"/>
    <path d="M11.1,17.6 L8.8,21.3" stroke="#F5D98B"/>
  </g>
  <!-- minor branches off two of the first nodes, into the two open gaps
       between the main routes: thinner and smaller so they read as
       secondary without cluttering the 24px silhouette. -->
  <g stroke-linecap="round" fill="none" stroke-width="0.7" stroke="#B8860B">
    <path d="M20.4,13.2 L23.2,14.2"/>
    <path d="M11.1,17.6 L8.4,16.3"/>
  </g>
  <g fill="#F4F6F8">
    <circle cx="16" cy="16" r="2.3"/>
    <circle cx="14.2" cy="11.1" r="1.2"/>
    <circle cx="15.3" cy="6.9" r="1.2"/>
    <circle cx="20.4" cy="13.2" r="1.2"/>
    <circle cx="21.0" cy="8.9" r="1.2"/>
    <circle cx="17.3" cy="21.0" r="1.2"/>
    <circle cx="16.9" cy="25.3" r="1.2"/>
    <circle cx="11.1" cy="17.6" r="1.2"/>
    <circle cx="8.8" cy="21.3" r="1.2"/>
    <circle cx="23.2" cy="14.2" r="0.8"/>
    <circle cx="8.4" cy="16.3" r="0.8"/>
  </g>
</svg>
